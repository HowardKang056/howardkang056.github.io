<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛏️ 桌遊島 (Board Game Island)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pk-ocean-deep: #1b569c;
      --pk-ocean-mid: #2874c9;
      --pk-ocean-light: #4fa3f7;
      --pk-island-grass: #5cb838;
      --pk-island-grass-light: #76d14c;
      --pk-island-dirt: #9c5a2d;
      --pk-slate-panel: #223046;
      --pk-slate-dark: #162030;
      --pk-pixel-outline: #0d1520;
      --pk-gold: #f5b82e;
      --pk-gold-light: #fde047;
      --pk-shop-red: #e04a2f;
      --pk-hp-coral: #ef627c;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--pk-ocean-deep);
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* BGA State Machine Classes on #overall-content */
    #overall-content.gamestate_PLACE_TILE .state-badge {
      background: linear-gradient(180deg, #5cb838 0%, #3d8b20 100%);
      border: 1.5px solid #bef264;
    }
    #overall-content.gamestate_PLACE_MEEPLE .state-badge {
      background: linear-gradient(180deg, #f5b82e 0%, #c77d12 100%);
      color: #0d1520 !important;
      border: 1.5px solid #fef08a;
    }
    #overall-content.gamestate_GAME_OVER .state-badge {
      background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
      border: 1.5px solid #c7d2fe;
    }

    .bga-card-hover {
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .bga-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 0 #0d1520, 0 18px 32px rgba(0, 0, 0, 0.65) !important;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(13, 21, 32, 0.75);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475d7d;
      border-radius: 4px;
      border: 1px solid #0d1520;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #6482ad;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 5px 0 #0d1520, 0 0 0 0 rgba(245, 184, 46, 0.55); }
      50% { box-shadow: 0 5px 0 #0d1520, 0 0 0 6px rgba(245, 184, 46, 0); }
    }
    .pulse-playable {
      animation: pulseGlow 2.2s infinite;
    }

    /* Mobile RWD & Touch Enhancements */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #board-canvas {
      touch-action: none;
    }
    #splendor-canvas, #pr-canvas, #alh-canvas {
      touch-action: manipulation;
    }
    @media (max-width: 1023px) {
      .mobile-drawer-collapsed {
        height: 0px !important;
        min-height: 0px !important;
        padding-top: 0px !important;
        padding-bottom: 0px !important;
        border-top-width: 0px !important;
        overflow: hidden !important;
      }
    }
    @media (max-width: 639px) {
      #overall-content.gamestate_PLACE_TILE #current-tile-widget.mobile-widget-minimized #widget-collapsible-body {
        display: none;
      }
      #current-tile-widget.mobile-widget-minimized {
        width: 9.5rem !important;
        padding: 0.45rem 0.65rem !important;
      }
    }

    .rwd-wrap-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.375rem;
      max-width: 100%;
    }

    #pagemaintitletext,
    #spl-status-text,
    #pr-status-text,
    #alh-status-text {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
      word-break: break-word;
      line-height: 1.35;
    }
    .draggable-status-box {
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.15s ease;
    }
    .draggable-status-box:active {
      cursor: grabbing;
      box-shadow: 0 8px 24px rgba(245, 184, 46, 0.5) !important;
    }

    /* =====================================================================
     * PICKAXE KING ISLAND (ROGUE UNION GAMES) PIXEL-ART & RPG UI SYSTEM
     * 完整還原《Pickaxe King Island》海洋波紋、翠綠像素島嶼、頂部資源膠囊列、
     * 白框黑底置中 QUEST 任務盒、粉紅王冠 HP 條、紅頂木屋商店與 3D 像素立體按鈕
     * ===================================================================== */

    /* 1. 全域背景：Pickaxe King Island 像素湛藍海洋 + 白色像素波紋背景 */
    body,
    #site-auth-gate,
    #lobby-view {
      background-color: #1e62b0 !important;
      background-image:
        /* 像素白色海水波紋點綴 */
        linear-gradient(90deg, rgba(165, 220, 255, 0.25) 6px, transparent 6px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.18) 4px, transparent 4px),
        /* 16x16 像素海洋方塊棋盤格 */
        repeating-conic-gradient(rgba(18, 56, 108, 0.22) 0% 25%, transparent 0% 50%),
        linear-gradient(180deg, #2874c9 0%, #1d5ca8 55%, #154582 100%) !important;
      background-size: 96px 48px, 64px 32px, 32px 32px, 100% 100% !important;
      background-position: 12px 18px, 44px 36px, 0 0, 0 0 !important;
      color: #ffffff !important;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* 四大桌遊全螢幕遊戲室背景：高對比像素石板深藍底色，突顯棋盤與板塊 */
    #overall-content,
    #splendor-overall-content,
    #pr-overall-content,
    #alh-overall-content {
      background-color: #141e2e !important;
      color: #ffffff !important;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* 2. Pickaxe King Island 頂部資源膠囊 (Top Resource HUD Pills) */
    .pk-resource-pill {
      background: linear-gradient(180deg, #3c5173 0%, #2a3b56 100%) !important;
      border: 2px solid #0d1520 !important;
      border-radius: 0.65rem !important;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        inset 0 -2px 0 rgba(0, 0, 0, 0.35),
        0 2px 0 #0d1520 !important;
    }

    .pk-king-emblem {
      background: linear-gradient(180deg, #76d14c 0%, #469625 65%, #9c5a2d 65%, #75401c 100%) !important;
      border: 2.5px solid #0d1520 !important;
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.45),
        0 3px 0 #0d1520,
        0 0 0 2px #fde047 !important;
    }

    /* 3. Pickaxe King Island 標誌性白框黑底任務指引盒 (QUEST Box & In-Game Banner) */
    .pk-quest-box {
      background: linear-gradient(180deg, rgba(16, 26, 38, 0.94) 0%, rgba(11, 18, 28, 0.96) 100%) !important;
      border: 2.5px solid #ffffff !important;
      border-radius: 0.95rem !important;
      box-shadow:
        0 0 0 2.5px #0d1520,
        0 6px 0 #0d1520,
        0 14px 28px rgba(0, 0, 0, 0.65) !important;
    }

    .pk-quest-header-tag {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d1520;
      border: 2px solid #ffffff;
      border-radius: 0.45rem;
      padding: 1px 12px;
      font-family: 'Silkscreen', 'DotGothic16', 'Noto Sans TC', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: #fde047;
      text-shadow: 0 2px 0 #000000;
      white-space: nowrap;
      box-shadow: 0 2px 0 #000000;
    }

    .pk-quest-icon-slot {
      background: linear-gradient(180deg, #25354d 0%, #182334 100%);
      border: 2px solid #6482ad;
      border-radius: 0.75rem;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 3px 0 #0d1520;
    }

    .pk-step-chip {
      background: rgba(32, 48, 70, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 0.65rem;
      box-shadow: 0 2px 0 #0d1520;
    }

    .pk-step-num {
      width: 22px;
      height: 22px;
      border-radius: 0.4rem;
      border: 1.5px solid #0d1520;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      flex-shrink: 0;
    }

    /* 遊戲內頂部中央 QUEST 任務狀態橫幅 */
    .pk-quest-banner {
      background: linear-gradient(180deg, rgba(14, 23, 35, 0.96) 0%, rgba(10, 17, 26, 0.98) 100%) !important;
      border: 2.5px solid #ffffff !important;
      border-radius: 0.85rem !important;
      box-shadow:
        0 0 0 2px #0d1520,
        0 4px 0 #0d1520,
        0 8px 18px rgba(0, 0, 0, 0.6) !important;
    }

    .pk-mini-quest-badge {
      background: #fde047;
      color: #0d1520;
      border: 1.5px solid #0d1520;
      border-radius: 0.35rem;
      padding: 1px 6px;
      font-family: 'Silkscreen', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.05em;
      box-shadow: 0 1.5px 0 #0d1520;
      flex-shrink: 0;
    }

    /* 4. Pickaxe King Island 國王粉紅/珊瑚紅 HP 狀態條 (.pk-king-hp-pill) */
    .pk-king-hp-pill {
      background: linear-gradient(180deg, #ef627c 0%, #cf3e58 100%);
      border: 2px solid #ffffff;
      border-radius: 9999px;
      box-shadow:
        0 0 0 2px #0d1520,
        inset 0 2px 0 rgba(255, 255, 255, 0.38),
        0 3px 0 #0d1520;
      text-shadow: 0 1.5px 0 #0d1520;
    }

    /* 5. Pickaxe King Island 右側懸浮皮革戰況背包按鈕 (.pk-backpack-fab) */
    .pk-backpack-fab {
      width: 52px;
      height: 52px;
      background: linear-gradient(180deg, rgba(118, 209, 76, 0.92) 0%, rgba(56, 136, 222, 0.92) 100%) !important;
      border: 2.5px solid #ffffff !important;
      border-radius: 0.85rem !important;
      box-shadow:
        0 0 0 2px #0d1520,
        0 4px 0 #0d1520,
        0 8px 18px rgba(0, 0, 0, 0.65) !important;
    }

    /* 6. Pickaxe King Island 紅頂木屋商店風格 (SHOP / ISLAND Cards) */
    .pk-shop-card,
    .pk-island-card {
      background: linear-gradient(180deg, #25354d 0%, #1b273a 100%) !important;
      border: 2.5px solid #0d1520 !important;
      box-shadow:
        0 0 0 2px #d49117,
        0 6px 0 #0d1520,
        0 14px 28px rgba(0, 0, 0, 0.6) !important;
    }

    .pk-shop-roof {
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0px, rgba(0, 0, 0, 0.14) 2px, transparent 2px, transparent 16px),
        linear-gradient(180deg, #e85338 0%, #bf341b 100%) !important;
      border-bottom: 2.5px solid #0d1520 !important;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
    }

    .pk-shop-sign {
      background: linear-gradient(180deg, #f7d794 0%, #d9a752 100%);
      color: #2b1808;
      border: 1.5px solid #0d1520;
      border-radius: 0.35rem;
      box-shadow: 0 1.5px 0 #0d1520;
    }

    .pk-card-quest-strip {
      background: rgba(13, 21, 32, 0.88);
      border: 1.5px solid rgba(253, 224, 71, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    /* 7. 通用面板、側邊欄、彈窗：Pickaxe King Island 深藍石板 + 木質黃金像素邊框 */
    .bg-slate-900,
    .bg-slate-900\/95,
    .bg-slate-900\/90,
    .bg-slate-900\/85,
    .bg-slate-900\/80,
    .bg-stone-900,
    .seurat-card,
    .seurat-dot-frame,
    aside {
      background: linear-gradient(180deg, #24344d 0%, #1b283c 100%) !important;
      border: 2px solid #d49117 !important;
      color: #ffffff !important;
      box-shadow:
        0 0 0 2px #0d1520,
        inset 0 2px 0 rgba(255, 255, 255, 0.16),
        0 6px 0 #0d1520,
        0 12px 24px rgba(0, 0, 0, 0.55) !important;
    }

    .bg-slate-950,
    .bg-slate-950\/95,
    .bg-slate-950\/90,
    .bg-slate-950\/80,
    .bg-slate-950\/75,
    .bg-slate-950\/70,
    .bg-slate-950\/60,
    .bg-stone-950\/75,
    .bg-slate-800,
    .bg-slate-800\/90,
    .bg-slate-800\/80,
    .seurat-subcard,
    .pk-subpanel {
      background: linear-gradient(180deg, #192538 0%, #131d2c 100%) !important;
      border-color: rgba(245, 184, 46, 0.5) !important;
      color: #f8fafc !important;
    }

    .border-slate-800,
    .border-slate-800\/80,
    .border-slate-700,
    .border-slate-700\/90,
    .border-slate-700\/80,
    .border-stone-800 {
      border-color: rgba(245, 184, 46, 0.45) !important;
    }

    .text-slate-400,
    .text-slate-500,
    .text-stone-400 {
      color: #cbd5e1 !important;
    }
    .text-slate-300,
    .text-stone-300 {
      color: #f1f5f9 !important;
    }

    /* 8. 所有按鈕：Pickaxe King Island 3D 像素斜角立體 RPG 按鈕 */
    button,
    .seurat-btn {
      cursor: pointer !important;
      background: linear-gradient(180deg, #3c5275 0%, #283954 100%);
      border: 2px solid #0d1520 !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      text-shadow: 0 1.5px 0 rgba(0, 0, 0, 0.85);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.35),
        inset 0 -2px 0 rgba(0, 0, 0, 0.35),
        0 3px 0 #0d1520 !important;
      transition: transform 0.1s ease, filter 0.1s ease, box-shadow 0.1s ease !important;
    }

    button:hover:not(:disabled),
    .seurat-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.5),
        inset 0 -2px 0 rgba(0, 0, 0, 0.35),
        0 4px 0 #0d1520,
        0 0 12px rgba(253, 224, 71, 0.45) !important;
    }

    button:active:not(:disabled),
    .seurat-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.45),
        0 1px 0 #0d1520 !important;
    }

    /* 商店磚紅按鈕 (Danger / Leave) */
    button.from-rose-500,
    button.bg-rose-600,
    button.bg-rose-500 {
      background: linear-gradient(180deg, #e85338 0%, #b82f16 100%) !important;
      color: #ffffff !important;
    }

    /* 海洋鈷藍按鈕 (Multiplayer / Info) */
    button.from-sky-500,
    button.bg-sky-600,
    button.bg-sky-500 {
      background: linear-gradient(180deg, #4294eb 0%, #2166b5 100%) !important;
      color: #ffffff !important;
    }

    /* 國王皇冠金按鈕 (深色像素字體，超高對比) */
    button.from-amber-500,
    button.from-orange-500,
    button.bg-amber-500,
    button.bg-amber-400,
    button.bg-orange-500 {
      background: linear-gradient(180deg, #fde047 0%, #eab308 100%) !important;
      color: #0d1520 !important;
      font-weight: 900 !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) !important;
    }

    button.bg-amber-600 {
      background: linear-gradient(180deg, #ea8a1a 0%, #b86209 100%) !important;
      color: #ffffff !important;
    }

    /* 國王島翠綠草地按鈕 (Primary Start / Confirm) */
    button.from-emerald-500,
    button.bg-emerald-600,
    button.bg-emerald-500 {
      background: linear-gradient(180deg, #68c940 0%, #439622 100%) !important;
      color: #ffffff !important;
    }

    select,
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      background-color: #111a28 !important;
      border: 2px solid #f5b82e !important;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 2px 0 #0d1520;
    }

    .seurat-badge {
      background: rgba(245, 184, 46, 0.22);
      border: 1.5px solid #fde047;
      color: #fef08a;
    }

    header,
    .pk-hud-header {
      background: linear-gradient(180deg, #273854 0%, #1b283d 100%) !important;
      border-bottom: 3px solid #0d1520 !important;
      box-shadow: inset 0 -2px 0 #d49117, 0 4px 12px rgba(0, 0, 0, 0.5) !important;
      transition: all 0.2s ease;
    }

    /* === Pickaxe King Island Mobile-First Bottom Thumb Dock === */
    @media (max-width: 639px) {
      input[type="text"], input[type="password"], input[type="number"], select {
        font-size: 16px !important;
      }
      header {
        padding-top: 0.4rem !important;
        padding-bottom: 0.4rem !important;
      }
    }

    .pk-bottom-dock {
      background: linear-gradient(180deg, #273854 0%, #192538 100%) !important;
      border-top: 3px solid #0d1520 !important;
      box-shadow: inset 0 2px 0 #f5b82e, 0 -6px 20px rgba(0, 0, 0, 0.65) !important;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .pk-dock-btn {
      min-height: 48px;
      border-radius: 0.75rem !important;
      padding: 0.35rem 0.25rem !important;
      font-size: 11px !important;
      line-height: 1.15 !important;
    }

    .game-header-collapsed {
      display: none !important;
    }
    .lobby-collapsible-hidden {
      display: none !important;
    }
    @media (max-width: 1023px) {
      #pr-bottom-action-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

  <!-- ==================== 零預渲染密碼學安全門禁 (未通過 AES-256-GCM 解密前，DOM 完全不存在遊戲 HTML 與程式碼) ==================== -->
  <!-- <noscript>
    <div style="position:fixed;inset:0;z-index:99999;background:#0d1520;color:#fde047;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;font-weight:bold;">
      🔒 本應用程式採用瀏覽器端 PBKDF2 + AES-256-GCM 密碼學加密保護。停用 JavaScript 時無法執行金鑰衍生與解密，請啟用 JavaScript 後輸入通行密碼。
    </div>
  </noscript> -->

  <div id="site-auth-gate" class="fixed inset-0 z-[120] flex items-center justify-center p-4 overflow-y-auto">
    <div class="pk-shop-card rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
      <!-- Pickaxe King Island 紅頂城門橫幅 -->
      <div class="pk-shop-roof px-5 py-3 flex items-center justify-between">
        <span class="pk-shop-sign px-2.5 py-0.5 text-xs font-black tracking-wider">Board Game Island • 桌遊島港口</span>
      </div>

      <div class="p-5 sm:p-6 space-y-4">
        <div class="flex items-center gap-3.5 border-b border-slate-700 pb-3.5">
          <div class="w-14 h-14 rounded-2xl pk-king-emblem flex items-center justify-center font-black text-3xl text-white shrink-0">
            👑
          </div>
          <div>
            <span class="text-xl px-2.5 py-0.5 rounded-full seurat-badge font-extrabold">⛏️ Board Game Island 桌遊島</span>
          </div>
        </div>

        <!-- Pickaxe King Island 白框任務提示盒 -->
        <div class="pk-quest-box relative px-4 py-3 mt-2">
          <div class="pk-quest-header-tag">QUEST 0 • 登島驗證</div>
          <p class="text-xs text-slate-200 leading-relaxed pt-1 text-center">
            輸入您的 <strong>暱稱</strong> 與 <strong>桌遊島通行密碼</strong>
          </p>
        </div>

        <form id="site-auth-form" class="space-y-4 pt-1">
          <div class="space-y-1.5">
            <label for="site-auth-nickname" class="block text-xs font-black text-amber-300">👤 您的暱稱（單機或連線對局顯示）：</label>
            <input id="site-auth-nickname" type="text" maxlength="20" required placeholder="例如：阿哲、小美、桌遊國王..." class="w-full rounded-xl px-3.5 py-3 text-base sm:text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-400" />

      const SESSION_KEY_STORAGE = "bga_session_aes_key_b64";
      const SESSION_NICK_STORAGE = "bga_site_nickname";

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function bytesToB64(bytes) {
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      async function deriveAesKeyFromPassword(passwordPlain) {
        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(passwordPlain),
          "PBKDF2",
          false,
          ["deriveBits", "deriveKey"]
        );
        const rawBits = await window.crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: b64ToBytes(SALT_B64),
            iterations: 100000,
            hash: "SHA-256"
          },
          baseKey,
          256
        );
        return new Uint8Array(rawBits);
      }

      async function decryptAndMountWithRawKey(rawKeyBytes, nickname) {
        const cryptoKey = await window.crypto.subtle.importKey(
          "raw",
          rawKeyBytes,
          { name: "AES-GCM" },
          false,
          ["decrypt"]
        );
        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
          cryptoKey,
          b64ToBytes(CIPHER_B64)
        );
        const jsonText = new TextDecoder("utf-8").decode(decryptedBuf);
        const bundle = JSON.parse(jsonText);

        // 移除登入門禁 DOM，注入解密後的完整 HTML 並掛載執行遊戲腳本
        const gateEl = document.getElementById("site-auth-gate");
        if (gateEl) gateEl.remove();

        const rootEl = document.getElementById("bga-decrypted-app-root");
        rootEl.innerHTML = bundle.html;
        rootEl.classList.remove("hidden");

        const scriptEl = document.createElement("script");
        scriptEl.textContent = bundle.js;
        document.body.appendChild(scriptEl);

        if (typeof window.bootBgaApplication === "function") {
          window.bootBgaApplication(nickname);
        }
      }

      window.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("site-auth-form");
        const nickInp = document.getElementById("site-auth-nickname");
        const pwInp = document.getElementById("site-auth-password");
        const errEl = document.getElementById("site-auth-error");
        const submitBtn = document.getElementById("btn-site-auth-submit");

        // 檢查 sessionStorage 是否已有本分頁驗證通過的衍生金鑰
        try {
          const savedKeyB64 = sessionStorage.getItem(SESSION_KEY_STORAGE);
          const savedNick = sessionStorage.getItem(SESSION_NICK_STORAGE);
          if (savedKeyB64 && savedNick) {
            await decryptAndMountWithRawKey(b64ToBytes(savedKeyB64), savedNick);
            return;
          }
        } catch (e) {
          try { sessionStorage.removeItem(SESSION_KEY_STORAGE); } catch (err) {}
        }

        form.addEventListener("submit", async e => {
          e.preventDefault();
          const nick = (nickInp.value || "").trim();
          const pw = pwInp.value || "";
          if (!nick || !pw) {
            errEl.classList.remove("hidden");
            return;
          }
          submitBtn.disabled = true;
          submitBtn.textContent = "🔐 正在執行驗證...";
          errEl.classList.add("hidden");

          try {
            const rawKeyBytes = await deriveAesKeyFromPassword(pw);
            await decryptAndMountWithRawKey(rawKeyBytes, nick);
            try {
              sessionStorage.setItem(SESSION_KEY_STORAGE, bytesToB64(rawKeyBytes));
              sessionStorage.setItem(SESSION_NICK_STORAGE, nick);
            } catch (storageErr) {}
          } catch (decErr) {
            errEl.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "⛏️ 解密驗證並登陸桌遊島";
          }
        });
      });
    })();
  </script>
