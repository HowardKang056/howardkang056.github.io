<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌遊試玩</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bga-dark: #0f172a;
      --bga-header: #1e293b;
      --bga-accent: #10b981;
      --bga-gold: #f59e0b;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
      overflow-x: hidden;
    }
    /* BGA State Machine Classes on #overall-content */
    #overall-content.gamestate_PLACE_TILE .state-badge {
      background: linear-gradient(135deg, #059669, #10b981);
    }
    #overall-content.gamestate_PLACE_MEEPLE .state-badge {
      background: linear-gradient(135deg, #d97706, #f59e0b);
    }
    #overall-content.gamestate_GAME_OVER .state-badge {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
    }
    .bga-card-hover {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .bga-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.6), 0 0 18px rgba(16, 185, 129, 0.25);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.6);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.9);
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .pulse-playable {
      animation: pulseGlow 2.2s infinite;
    }
    /* Mobile RWD & Touch Enhancements */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    #board-canvas {
      touch-action: none;
    }
    #splendor-canvas, #pr-canvas, #alh-canvas {
      touch-action: manipulation;
    }
    @media (max-width: 1023px) {
      .mobile-drawer-collapsed {
        height: 0px !important;
        min-height: 0px !important;
        padding-top: 0px !important;
        padding-bottom: 0px !important;
        border-top-width: 0px !important;
        overflow: hidden !important;
      }
    }
    @media (max-width: 639px) {
      #overall-content.gamestate_PLACE_TILE #current-tile-widget.mobile-widget-minimized #widget-collapsible-body {
        display: none;
      }
      #current-tile-widget.mobile-widget-minimized {
        width: 9.5rem !important;
        padding: 0.45rem 0.65rem !important;
      }
    }

    /* 頂部選單與遊戲啟動列：自動換行完整顯示 + 支援滑鼠/觸控拖曳 */
    .rwd-wrap-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.375rem;
      max-width: 100%;
    }
    /* 遊玩時的狀態提示文字：取消截斷 (truncate)，允許完整多行顯示並支援拖曳移動 */
    #pagemaintitletext,
    #splendor-status-text,
    #pr-status-text,
    #alh-status-text {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: clip !important;
      word-break: break-word;
      line-height: 1.35;
    }
    .draggable-status-box {
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: box-shadow 0.15s ease;
    }
    .draggable-status-box:active {
      cursor: grabbing;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.45);
    }

    /* =====================================================================
     * GEORGES SEURAT "LA GRANDE JATTE" POINTILLIST & HIGH-CONTRAST UI SYSTEM
     * 兼具《大碗島的星期天下午》純色圓點光學並置筆觸、1889 彩點畫框與超高對比可點擊立體識別
     * ===================================================================== */
    :root {
      --seurat-linen: #f5eedc;
      --seurat-ivory: #fbf7ec;
      --seurat-sun-yellow: #e8c858;
      --seurat-lawn-green: #68913f;
      --seurat-seine-blue: #467199;
      --seurat-parasol-red: #c85a3a;
      --seurat-violet: #725e82;
    }

    /* 1. 全域背景：深炭灰夜色底層交織秀拉五色點描微粒 (檸檬金、草地綠、塞納藍、陽傘紅、藕紫) */
    body,
    #overall-content,
    #splendor-overall-content,
    #pr-overall-content,
    #alh-overall-content {
      background-color: #15181f !important;
      background-image:
        radial-gradient(rgba(232, 200, 88, 0.14) 1.25px, transparent 1.25px),
        radial-gradient(rgba(104, 145, 63, 0.14) 1.25px, transparent 1.25px),
        radial-gradient(rgba(70, 113, 153, 0.15) 1.25px, transparent 1.25px),
        radial-gradient(rgba(200, 90, 58, 0.12) 1.25px, transparent 1.25px),
        linear-gradient(160deg, #171b22 0%, #14181f 52%, #101319 100%) !important;
      background-size: 12px 12px, 12px 12px, 12px 12px, 12px 12px, 100% 100% !important;
      background-position: 0 0, 6px 2px, 2px 6px, 8px 8px, 0 0 !important;
      color: #fbf7ec !important;
      font-family: 'Georgia', 'Noto Serif TC', 'Inter', serif;
    }

    /* 2. 所有容器、卡片、側欄、彈窗 (div, card, aside, section, modal)：
          點描畫布肌理 + 秀拉 1889 雙層彩點畫框邊界 */
    .bg-slate-900,
    .bg-slate-900\/95,
    .bg-slate-900\/90,
    .bg-slate-900\/85,
    .bg-slate-900\/80,
    .bg-stone-900,
    .seurat-card,
    .seurat-dot-frame,
    aside {
      background-color: #1e242d !important;
      background-image:
        radial-gradient(rgba(232, 200, 88, 0.11) 1.15px, transparent 1.15px),
        radial-gradient(rgba(70, 113, 153, 0.12) 1.15px, transparent 1.15px),
        radial-gradient(rgba(200, 90, 58, 0.09) 1.15px, transparent 1.15px),
        linear-gradient(145deg, rgba(32, 39, 49, 0.97) 0%, rgba(23, 28, 36, 0.97) 100%) !important;
      background-size: 10px 10px, 10px 10px, 10px 10px, 100% 100% !important;
      background-position: 0 0, 5px 3px, 2px 7px, 0 0 !important;
      border: 1.5px solid rgba(232, 200, 88, 0.55) !important;
      color: #fbf7ec !important;
      box-shadow:
        0 0 0 2px rgba(70, 113, 153, 0.32),
        inset 0 1px 0 rgba(251, 247, 236, 0.15),
        0 8px 22px -4px rgba(0, 0, 0, 0.65) !important;
    }

    .bg-slate-950,
    .bg-slate-950\/95,
    .bg-slate-950\/90,
    .bg-slate-950\/80,
    .bg-slate-950\/75,
    .bg-slate-950\/70,
    .bg-slate-950\/60,
    .bg-stone-950\/75,
    .seurat-subcard {
      background-color: #161a22 !important;
      background-image:
        radial-gradient(rgba(232, 200, 88, 0.09) 1px, transparent 1px),
        radial-gradient(rgba(104, 145, 63, 0.09) 1px, transparent 1px),
        radial-gradient(rgba(114, 94, 130, 0.09) 1px, transparent 1px),
        linear-gradient(160deg, rgba(23, 28, 36, 0.96) 0%, rgba(17, 21, 28, 0.96) 100%) !important;
      background-size: 9px 9px, 9px 9px, 9px 9px, 100% 100% !important;
      background-position: 0 0, 4px 4px, 7px 2px, 0 0 !important;
      border-color: rgba(232, 200, 88, 0.42) !important;
      color: #fbf7ec !important;
    }

    .border-slate-800,
    .border-slate-800\/80,
    .border-slate-700,
    .border-slate-700\/90,
    .border-slate-700\/80,
    .border-stone-800 {
      border-color: rgba(232, 200, 88, 0.45) !important;
    }

    .text-slate-400,
    .text-slate-500,
    .text-stone-400 {
      color: #d6d3c9 !important;
    }
    .text-slate-300,
    .text-stone-300 {
      color: #ede8d8 !important;
    }

    /* 3. 所有按鈕 (button, .seurat-btn)：秀拉點描油彩筆觸 + 鮮明 3D 立體浮凸邊框 + 超高對比文字 */
    button,
    .seurat-btn {
      cursor: pointer !important;
      background-color: #2b3d4f;
      background-image:
        radial-gradient(rgba(251, 247, 236, 0.22) 1.1px, transparent 1.1px),
        radial-gradient(rgba(232, 200, 88, 0.20) 1.1px, transparent 1.1px),
        linear-gradient(180deg, #34495e 0%, #22313f 100%);
      background-size: 7px 7px, 7px 7px, 100% 100%;
      background-position: 0 0, 3.5px 3.5px, 0 0;
      border: 2px solid #e8c858 !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.35),
        0 3px 0 #0d1117,
        0 5px 12px rgba(0, 0, 0, 0.5) !important;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, filter 0.12s ease !important;
    }

    button:hover:not(:disabled),
    .seurat-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.12);
      border-color: #fff3b0 !important;
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.5),
        0 4px 0 #0d1117,
        0 0 14px rgba(232, 200, 88, 0.55) !important;
    }

    button:active:not(:disabled),
    .seurat-btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.45),
        0 1px 0 #0d1117 !important;
    }

    /* 陽傘朱紅點描按鈕 */
    button.from-rose-500,
    button.bg-rose-600,
    button.bg-rose-500 {
      background-image:
        radial-gradient(rgba(251, 232, 140, 0.28) 1.15px, transparent 1.15px),
        radial-gradient(rgba(114, 94, 130, 0.24) 1.15px, transparent 1.15px),
        linear-gradient(180deg, #c85236 0%, #96341e 100%) !important;
      background-size: 7px 7px, 7px 7px, 100% 100% !important;
      background-position: 0 0, 3.5px 3.5px, 0 0 !important;
      border-color: #fde68a !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* 塞納河鈷藍點描按鈕 */
    button.from-sky-500,
    button.bg-sky-600,
    button.bg-sky-500 {
      background-image:
        radial-gradient(rgba(245, 222, 130, 0.26) 1.15px, transparent 1.15px),
        radial-gradient(rgba(104, 145, 63, 0.22) 1.15px, transparent 1.15px),
        linear-gradient(180deg, #386794 0%, #234569 100%) !important;
      background-size: 7px 7px, 7px 7px, 100% 100% !important;
      background-position: 0 0, 3.5px 3.5px, 0 0 !important;
      border-color: #bae6fd !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* 日光檸檬金點描按鈕 (深黑文字，超高對比度) */
    button.from-amber-500,
    button.from-orange-500,
    button.bg-amber-500,
    button.bg-amber-400,
    button.bg-orange-500 {
      background-image:
        radial-gradient(rgba(200, 90, 58, 0.22) 1.15px, transparent 1.15px),
        radial-gradient(rgba(255, 255, 255, 0.38) 1.15px, transparent 1.15px),
        linear-gradient(180deg, #f3ce5a 0%, #d49f2a 100%) !important;
      background-size: 7px 7px, 7px 7px, 100% 100% !important;
      background-position: 0 0, 3.5px 3.5px, 0 0 !important;
      border-color: #fef9c3 !important;
      color: #0f172a !important;
      font-weight: 900 !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55) !important;
    }

    button.bg-amber-600 {
      background-image:
        radial-gradient(rgba(251, 247, 236, 0.24) 1.15px, transparent 1.15px),
        linear-gradient(180deg, #c77d24 0%, #8f5310 100%) !important;
      background-size: 7px 7px, 100% 100% !important;
      border-color: #fde68a !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9) !important;
    }

    /* 大碗島草地翠綠點描按鈕 */
    button.from-emerald-500,
    button.bg-emerald-600,
    button.bg-emerald-500 {
      background-image:
        radial-gradient(rgba(245, 222, 130, 0.28) 1.15px, transparent 1.15px),
        radial-gradient(rgba(70, 113, 153, 0.24) 1.15px, transparent 1.15px),
        linear-gradient(180deg, #528236 0%, #345920 100%) !important;
      background-size: 7px 7px, 7px 7px, 100% 100% !important;
      background-position: 0 0, 3.5px 3.5px, 0 0 !important;
      border-color: #bef264 !important;
      color: #ffffff !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9) !important;
    }

    select,
    input[type="text"] {
      background-color: #141820 !important;
      border: 1.5px solid #e8c858 !important;
      color: #ffffff !important;
      font-weight: 700;
    }

    .seurat-badge {
      background-color: rgba(232, 200, 88, 0.20);
      border: 1.5px solid rgba(232, 200, 88, 0.70);
      color: #fef08a;
    }

    header {
      background-image:
        radial-gradient(rgba(232, 200, 88, 0.14) 1.15px, transparent 1.15px),
        radial-gradient(rgba(200, 90, 58, 0.12) 1.15px, transparent 1.15px),
        radial-gradient(rgba(70, 113, 153, 0.13) 1.15px, transparent 1.15px),
        linear-gradient(90deg, rgba(22, 27, 35, 0.98) 0%, rgba(30, 38, 46, 0.98) 50%, rgba(22, 27, 35, 0.98) 100%) !important;
      background-size: 10px 10px, 10px 10px, 10px 10px, 100% 100% !important;
      background-position: 0 0, 5px 3px, 2px 7px, 0 0 !important;
      border-bottom: 2.5px solid rgba(232, 200, 88, 0.62) !important;
      transition: all 0.22s ease;
    }

    .game-header-collapsed {
      display: none !important;
    }
    .lobby-collapsible-hidden {
      display: none !important;
    }
    /* 波多黎各 1897 手機版隱藏下方行動選擇按鈕區塊（角色選擇、工人派發、賣貨、上船全部直接於畫布互動） */
    @media (max-width: 1023px) {
      #pr-bottom-action-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100">

  <script>
    (function() {

      const SESSION_KEY_STORAGE = "bga_session_aes_key_b64";
      const SESSION_NICK_STORAGE = "bga_site_nickname";

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      function bytesToB64(bytes) {
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }

      async function deriveAesKeyFromPassword(passwordPlain) {
        const enc = new TextEncoder();
        const baseKey = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(passwordPlain),
          "PBKDF2",
          false,
          ["deriveBits", "deriveKey"]
        );
        const rawBits = await window.crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: b64ToBytes(SALT_B64),
            iterations: 100000,
            hash: "SHA-256"
          },
          baseKey,
          256
        );
        return new Uint8Array(rawBits);
      }

      async function decryptAndMountWithRawKey(rawKeyBytes, nickname) {
        const cryptoKey = await window.crypto.subtle.importKey(
          "raw",
          rawKeyBytes,
          { name: "AES-GCM" },
          false,
          ["decrypt"]
        );
        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
          cryptoKey,
          b64ToBytes(CIPHER_B64)
        );
        const jsonText = new TextDecoder("utf-8").decode(decryptedBuf);
        const bundle = JSON.parse(jsonText);

        // 移除登入門禁 DOM，注入解密後的完整 HTML 並掛載執行遊戲腳本
        const gateEl = document.getElementById("site-auth-gate");
        if (gateEl) gateEl.remove();

        const rootEl = document.getElementById("bga-decrypted-app-root");
        rootEl.innerHTML = bundle.html;
        rootEl.classList.remove("hidden");

        const scriptEl = document.createElement("script");
        scriptEl.textContent = bundle.js;
        document.body.appendChild(scriptEl);

        if (typeof window.bootBgaApplication === "function") {
          window.bootBgaApplication(nickname);
        }
      }

      window.addEventListener("DOMContentLoaded", async () => {
        const form = document.getElementById("site-auth-form");
        const nickInp = document.getElementById("site-auth-nickname");
        const pwInp = document.getElementById("site-auth-password");
        const errEl = document.getElementById("site-auth-error");
        const submitBtn = document.getElementById("btn-site-auth-submit");

        // 檢查 sessionStorage 是否已有本分頁驗證通過的衍生金鑰
        try {
          const savedKeyB64 = sessionStorage.getItem(SESSION_KEY_STORAGE);
          const savedNick = sessionStorage.getItem(SESSION_NICK_STORAGE);
          if (savedKeyB64 && savedNick) {
            await decryptAndMountWithRawKey(b64ToBytes(savedKeyB64), savedNick);
            return;
          }
        } catch (e) {
          try { sessionStorage.removeItem(SESSION_KEY_STORAGE); } catch (err) {}
        }

        form.addEventListener("submit", async e => {
          e.preventDefault();
          const nick = (nickInp.value || "").trim();
          const pw = pwInp.value || "";
          if (!nick || !pw) {
            errEl.classList.remove("hidden");
            return;
          }
          submitBtn.disabled = true;
          submitBtn.textContent = "🔐 正在執行 PBKDF2 金鑰衍生與 AES-256-GCM 解密...";
          errEl.classList.add("hidden");

          try {
            const rawKeyBytes = await deriveAesKeyFromPassword(pw);
            await decryptAndMountWithRawKey(rawKeyBytes, nick);
            try {
              sessionStorage.setItem(SESSION_KEY_STORAGE, bytesToB64(rawKeyBytes));
              sessionStorage.setItem(SESSION_NICK_STORAGE, nick);
            } catch (storageErr) {}
          } catch (decErr) {
            errEl.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "🔓 解密驗證並載入桌遊競技場";
          }
        });
      });
    })();
  </script>
</body>
</html>
